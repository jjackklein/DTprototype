<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crossroads Health — Wearable Data Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================ Tokens ============================ */
:root{
  --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb; --g300:#d1d5db; --g400:#9ca3af;
  --g500:#6b7280; --g600:#4b5563; --g700:#374151; --g900:#111827;
  --t50:#f0fdfa; --t100:#ccfbf1; --t200:#99f6e4; --t500:#14b8a6; --t600:#0d9488;
  --t700:#0f766e; --t800:#115e59; --t900:#134e4a;
  --e50:#ecfdf5; --e100:#d1fae5; --e200:#a7f3d0; --e700:#047857; --e800:#065f46; --e900:#064e3b;
  --a50:#fffbeb; --a200:#fde68a; --a600:#d97706; --a700:#b45309; --a800:#92400e; --a900:#78350f;
  --r50:#fef2f2; --r200:#fecaca; --r700:#b91c1c; --r800:#991b1b;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--g900);font-size:14px}
#root{height:100%}
button{font:inherit;color:inherit;margin:0}
h1,h2,h3,p,dl,dd,dt,ol,ul,figure{margin:0}
ul,ol{padding:0;list-style:none}
table{border-collapse:collapse;width:100%}

/* ============================ Layout ============================ */
.app{display:flex;height:100%;width:100%;overflow:hidden;background:#fff}
.main{display:flex;min-width:0;flex:1;flex-direction:column}

.sidenav{display:flex;width:224px;flex:none;flex-direction:column;border-right:1px solid var(--g200);background:var(--g50)}
.sidenav-brand{display:flex;align-items:center;gap:10px;padding:16px}
.sidenav-brand b{font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brandmark{display:flex;height:32px;width:32px;flex:none;align-items:center;justify-content:center;border-radius:8px;
  font-size:12px;font-weight:700;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sidenav-list{min-height:0;flex:1;overflow-y:auto;padding:8px}
.navitem{display:block;width:100%;border:0;background:none;border-radius:8px;padding:8px 12px;text-align:left;
  font-size:14px;color:var(--g600);cursor:pointer}
.navitem:hover{background:var(--g100);color:var(--g900)}
.navitem.active{background:var(--t50);font-weight:500;color:var(--t800);box-shadow:inset 0 0 0 1px var(--t200)}

.pagehead{display:flex;flex:none;align-items:flex-start;justify-content:space-between;gap:24px;
  border-bottom:1px solid var(--g200);background:#fff;padding:20px 32px}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.pagehead .sub{margin-top:4px;font-size:14px;color:var(--g500)}
.pagehead-actions{display:flex;flex:none;align-items:center;gap:8px}

.pagebody{min-height:0;flex:1;overflow-y:auto;background:var(--g50);padding:24px 32px}
.pagebody.white{background:#fff}
.pagebody>*+*{margin-top:20px}
.pagebody.tight{padding:24px 28px}

.panel{border:1px solid var(--g200);border-radius:12px;background:#fff}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--g200);padding:14px 20px}
.panel-head h3{font-size:14px;font-weight:600}
.panel-head .sub{margin-top:2px;font-size:12px;color:var(--g500)}
.panel-body{padding:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1fr)}
.gap20{gap:20px}
@media(min-width:768px){ .g3{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(min-width:1024px){ .g2{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(min-width:640px){ .g23{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(min-width:1280px){
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .gmain{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .gmain.wide{grid-template-columns:minmax(0,1fr) 300px}
  .gmain.note{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .gmain.hub{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  .g3x{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span2{grid-column:span 2}
}

/* ============================ Cards / rows ============================ */
.card{overflow:hidden;border:1px solid var(--g200);border-radius:12px;background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-top:1px solid var(--g200)}
.card>.row:first-child{border-top:0}
.row.muted{background:var(--g50)}
.row.sel{background:rgba(240,253,250,.7)}
.row.bad{background:rgba(254,242,242,.6)}
.row.click{cursor:pointer}
.row.click:hover{background:var(--g50)}

.tile{display:flex;height:36px;width:36px;flex:none;align-items:center;justify-content:center;border-radius:8px;
  font-size:12px;font-weight:600;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tile.sm{height:32px;width:32px}
.tile.muted{background:var(--g200)!important;background-image:none!important;color:var(--g400);box-shadow:none}

.rowtext{min-width:0;flex:1}
.rowtext b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500;color:var(--g900)}
.rowtext.muted b{color:var(--g400)}
.rowtext span{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--g500)}
.chev{color:var(--g400);flex:none}
.rowval{font-size:14px;font-weight:500;color:var(--g900);text-align:right}

/* ============================ Buttons ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  border-radius:8px;font-weight:500;height:44px;padding:0 20px;font-size:14px;cursor:pointer;
  border:1px solid var(--t700);background:var(--t700);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn:hover{background:var(--t800);border-color:var(--t800)}
.btn:focus-visible{outline:2px solid var(--t600);outline-offset:2px}
.btn.sm{height:36px;padding:0 14px}
.btn.full{width:100%}
.btn.secondary{background:#fff;color:var(--g900);border-color:var(--g300);box-shadow:none}
.btn.secondary:hover{background:var(--g50);border-color:var(--g300)}
.btn.ghost{background:transparent;color:var(--g600);border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--g100);color:var(--g900)}
.btn.danger{background:var(--r700);border-color:var(--r700)}
.btn.danger:hover{background:var(--r800);border-color:var(--r800)}
.btn[disabled]{cursor:not-allowed;background:var(--g100);border-color:var(--g200);color:var(--g400);box-shadow:none}

.tlink{border:0;background:none;padding:0;cursor:pointer;font-size:14px;font-weight:500;color:var(--t700);
  text-decoration:underline;text-decoration-color:rgba(15,118,110,.3);text-underline-offset:4px}
.tlink:hover{text-decoration-color:var(--t700)}
.plainlink{border:0;background:none;padding:0;cursor:pointer;font-size:14px;color:var(--t700)}
.plainlink:hover{text-decoration:underline}

/* ============================ Controls ============================ */
.toggle{position:relative;display:inline-flex;height:24px;width:44px;flex:none;align-items:center;
  border:0;border-radius:999px;background:var(--g200);cursor:pointer;padding:0;transition:background .2s}
.toggle.on{background:var(--t600)}
.toggle[disabled]{cursor:not-allowed;opacity:.4}
.toggle i{display:block;height:20px;width:20px;border-radius:999px;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(17,24,39,.05);transform:translateX(2px);transition:transform .2s}
.toggle.on i{transform:translateX(22px)}

.cbx{display:flex;width:100%;align-items:flex-start;gap:12px;border:0;background:none;padding:0;
  text-align:left;cursor:pointer;color:inherit}
.cbx[disabled]{cursor:not-allowed;opacity:.5}
.cbx .ind{display:flex;height:20px;width:20px;flex:none;align-items:center;justify-content:center;margin-top:2px;
  border:1px solid var(--g300);border-radius:6px;background:#fff}
.cbx.on .ind{border-color:var(--t600);background:var(--t600)}
.cbx span{font-size:14px;line-height:1.4;color:var(--g700)}

.radio{display:flex;height:20px;width:20px;flex:none;align-items:center;justify-content:center;
  border:1px solid var(--g300);border-radius:999px;background:#fff;cursor:pointer;padding:0}
.radio.on{border-color:var(--t600)}
.radio i{display:block;height:10px;width:10px;border-radius:999px;background:var(--t600)}

.inp{height:40px;width:100%;border:1px solid var(--g300);border-radius:8px;background:#fff;padding:0 12px;
  font-family:inherit;font-size:14px;color:var(--g900)}
.inp.sm{height:36px;width:256px}
.ta{width:100%;border:1px solid var(--g300);border-radius:8px;background:#fff;padding:10px 12px;
  font-family:inherit;font-size:14px;line-height:1.6;color:var(--g900);resize:vertical}
.inp:focus,.ta:focus{outline:none;border-color:var(--t600);box-shadow:0 0 0 3px rgba(13,148,136,.2)}
.inp::placeholder,.ta::placeholder{color:var(--g400)}
.ta.summary{border-color:var(--e200);background:rgba(236,253,245,.6);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.flabel{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--g500)}
.fhint{margin-top:6px;font-size:12px;color:var(--g400)}
.fgroup+.fgroup{margin-top:16px}

/* ============================ Chips / callouts ============================ */
.chip{display:inline-flex;align-items:center;white-space:nowrap;border-radius:999px;padding:2px 10px;
  font-size:12px;font-weight:500;background:var(--g100);color:var(--g600);box-shadow:inset 0 0 0 1px var(--g200)}
.chip.teal{background:var(--t50);color:var(--t700);box-shadow:inset 0 0 0 1px var(--t200)}
.chip.success{background:var(--e50);color:var(--e700);box-shadow:inset 0 0 0 1px var(--e200)}
.chip.warn{background:var(--a50);color:var(--a700);box-shadow:inset 0 0 0 1px var(--a200)}
.chip.danger{background:var(--r50);color:var(--r700);box-shadow:inset 0 0 0 1px var(--r200)}

.callout{border:1px solid var(--g200);border-radius:12px;background:var(--g50);color:var(--g600);
  padding:12px 16px;font-size:12px;line-height:1.7}
.callout.teal{border-color:var(--t200);background:var(--t50);color:var(--t800)}
.callout.success{border-color:var(--e200);background:var(--e50);color:var(--e800)}
.callout.warn{border-color:var(--a200);background:var(--a50);color:var(--a800)}
.callout b{font-weight:600}
.callout button{color:inherit}

.empty{border:1px dashed var(--g300);border-radius:12px;background:rgba(249,250,251,.6);
  padding:24px 20px;text-align:center}
.empty.tall{padding:48px 20px}
.empty b{font-size:14px;font-weight:500;color:var(--g700)}
.empty p{margin:4px auto 0;max-width:28rem;font-size:12px;line-height:1.7;color:var(--g500)}

.seclabel{margin:0 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--g400)}
.screentitle{margin-bottom:24px}
.screentitle .step{margin-bottom:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t700)}
.screentitle h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.screentitle p{margin-top:6px;font-size:14px;line-height:1.7;color:var(--g500)}

.stat{border:1px solid var(--g200);border-radius:12px;background:#fff;padding:16px}
.stat.attention{border-color:var(--a200);background:var(--a50)}
.stat .lab{font-size:12px;color:var(--g500)}
.stat .val{margin-top:4px;font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat.attention .val{color:var(--a800)}
.stat .hint{margin-top:4px;font-size:12px;color:var(--g400)}

/* ============================ Tables ============================ */
.tablewrap{overflow:hidden;border:1px solid var(--g200);border-radius:12px;background:#fff}
.tablewrap table{font-size:14px}
.tablewrap th{border-bottom:1px solid var(--g200);background:var(--g50);padding:10px 20px;text-align:left;
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--g400)}
.tablewrap td{border-top:1px solid var(--g200);padding:12px 20px;color:var(--g700);vertical-align:middle}
.tablewrap tbody tr:first-child td{border-top:0}
.tablewrap tr.click{cursor:pointer}
.tablewrap tr.click:hover{background:var(--g50)}
.tablewrap tr.sel{background:rgba(240,253,250,.7)}
.tablewrap tr.isnew{background:var(--e50)}
.tablewrap.tight th,.tablewrap.tight td{padding:12px 16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--g600)}
.tcenter{padding:24px;text-align:center;color:var(--g400)}
.cellflex{display:flex;align-items:center;gap:10px}

.deflist>div{display:flex;gap:12px;font-size:14px}
.deflist>div+div{margin-top:10px}
.deflist dt{width:128px;flex:none;color:var(--g500)}
.deflist.narrow dt{width:80px}
.deflist.wide dt{width:112px}
.deflist dd{min-width:0;flex:1;color:var(--g900)}

/* ============================ Modal ============================ */
.backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(17,24,39,.5);padding:24px}
.modal{display:flex;max-height:85vh;width:100%;max-width:32rem;flex-direction:column;overflow:hidden;
  border-radius:16px;background:#fff;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.modal.md{max-width:28rem}
.modal-head{display:flex;flex:none;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--g200);padding:16px 20px}
.modal-head h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-foot{margin-top:24px;display:flex;justify-content:flex-end;gap:8px}
.iconbtn{border:0;background:none;border-radius:6px;padding:4px;color:var(--g400);cursor:pointer;line-height:0}
.iconbtn:hover{background:var(--g100);color:var(--g900)}

/* ============================ Account menu ============================ */
.acct{position:relative;border-top:1px solid var(--g200);padding:8px}
.acct-btn{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;border-radius:8px;
  padding:8px;text-align:left;cursor:pointer}
.acct-btn:hover{background:var(--g100)}
.avatar{display:flex;flex:none;align-items:center;justify-content:center;border-radius:999px;
  font-weight:600;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);border:0;padding:0;cursor:pointer}
.avatar.lg{height:32px;width:32px;font-size:12px}
.avatar.sm{height:28px;width:28px;font-size:10px}
.avatar.xl{height:40px;width:40px;font-size:14px}
.avatar.ring{box-shadow:0 0 0 2px #fff}
.acct-meta{min-width:0;flex:1;line-height:1.3}
.acct-meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500}
.acct-meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--g500)}
.acct-view{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 2px;
  font-size:12px;color:var(--g400)}

.menu{position:absolute;z-index:50;width:256px;overflow:hidden;border:1px solid var(--g200);border-radius:12px;
  background:#fff;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.menu.up{bottom:100%;left:0;margin-bottom:8px}
.menu.down{top:100%;right:0;margin-top:8px}
.menu .grouplab{padding:10px 12px 4px;font-size:12px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--g400)}
.menu-item{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 12px;
  text-align:left;cursor:pointer}
.menu-item:hover{background:var(--g50)}
.menu-item.active{background:var(--t50)}
.menu-item .m{min-width:0;flex:1;line-height:1.3}
.menu-item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:400;color:var(--g900)}
.menu-item.active .m b{font-weight:500;color:var(--t900)}
.menu-item .m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--g500)}
.menu-item .tick{color:var(--t700);line-height:0}
.menu-reset{width:100%;border:0;border-top:1px solid var(--g200);background:none;padding:8px 12px;margin-top:4px;
  text-align:left;font-size:14px;color:var(--g500);cursor:pointer}
.menu-reset:hover{background:var(--g50);color:var(--g900)}

.devtoggle{display:flex;align-items:center;gap:2px;border:1px solid var(--g200);border-radius:8px;background:#fff;padding:2px}
.devtoggle button{border:0;background:none;border-radius:6px;padding:4px;color:var(--g400);cursor:pointer;line-height:0}
.devtoggle button:hover{background:var(--g100);color:var(--g700)}
.devtoggle button.on{background:var(--g900);color:#fff}

/* ============================ Phone ============================ */
.phone-stage{height:100vh;overflow-y:auto;background:linear-gradient(to bottom,var(--g100),var(--g200))}
.phone-wrap{display:flex;min-height:100%;align-items:center;justify-content:center;padding:32px}
.phone{height:844px;width:390px;flex:none;border-radius:48px;background:var(--g900);padding:12px;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.25),0 0 0 1px rgba(17,24,39,.1)}
.phone-screen{display:flex;height:100%;width:100%;flex-direction:column;overflow:hidden;border-radius:36px;background:#fff}
.statusbar{position:relative;z-index:10;display:flex;height:48px;flex:none;align-items:center;
  justify-content:space-between;background:#fff;padding:0 28px}
.statusbar .time{font-size:14px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.statusbar .icons{display:flex;align-items:center;gap:6px;color:var(--g900)}
.notch{position:absolute;left:50%;top:8px;height:28px;width:112px;transform:translateX(-50%);
  border-radius:999px;background:var(--g900)}
.phone-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.homebar{display:flex;height:20px;flex:none;align-items:center;justify-content:center;background:#fff}
.homebar i{display:block;height:4px;width:128px;border-radius:999px;background:rgba(17,24,39,.2)}
.pscreen{display:flex;min-height:100%;flex-direction:column}
.pbody{flex:1;padding:0 20px}
.pbody.pb{padding-bottom:32px}
.pfoot{padding:32px 20px}
.pfoot .hint{margin-top:10px;text-align:center;font-size:12px;color:var(--g400)}
.pfoot .btn+.btn{margin-top:10px}

.appheader{padding:12px 20px 20px}
.appheader .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.appheader .org{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;font-weight:500;color:var(--g400)}
.appheader .right{display:flex;flex:none;align-items:center;gap:8px}
.appheader .nav{margin-top:8px;display:flex;height:24px;align-items:center;justify-content:space-between}
.avwrap{position:relative}
.backbtn{display:flex;align-items:center;border:0;background:none;border-radius:4px;margin-left:-4px;
  padding:0 4px;font-size:14px;color:var(--g500);cursor:pointer}
.backbtn:hover{color:var(--g900)}
.backbtn i{margin-right:2px;font-style:normal;font-size:16px;line-height:1}
.stepnum{font-size:12px;color:var(--g400)}

.notif{margin-bottom:24px;border:1px solid var(--g200);border-radius:12px;background:var(--g50);padding:12px 16px}
.notif .meta{margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--g400)}
.notif .meta b{font-weight:500;color:var(--g500)}
.notif .title{font-size:14px;font-weight:500;color:var(--g900)}
.notif .body{margin-top:2px;font-size:12px;color:var(--g500)}

/* ============================ Screen bits ============================ */
.successdot{display:flex;height:48px;width:48px;align-items:center;justify-content:center;margin-bottom:20px;
  border-radius:999px;background:var(--e100);color:var(--e700)}
.agreebox{margin-top:24px;border:1px solid var(--g200);border-radius:12px;background:var(--g50);padding:14px 16px}
.banner{display:flex;flex:none;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--g200);background:#fff;padding:16px 32px}

function segments(points) {

    if (p.v === null || p.v === undefined) { if (run.length) runs.push(run); run = []; }

function scales(data, key, width, height, pad) {

    var x = pad.l + (data.length <= 1 ? 0 : (i / (data.length - 1)) * innerW);
    var v = d[key];
    return { i: i, x: x, v: v, date: d.date, y: v === null ? null : pad.t + innerH - ((v - lo) / (hi - lo)) * innerH };
  });

function SourceRows(onAct) {

      Btn({ label: isOn ? 'Disconnect' : 'Connect', size: 'sm', variant: isOn ? 'secondary' : '', disabled: off,

// Only the metrics switched on here ever leave the patient's device account.
function MetricList() {
  var p = P(), declined = S.hub.skinTempStatus === 'declined';
  return Card(map(METRICS, function (m) {
    var gated = m.gated && !skinOK();
    var on = !!p.metrics[m.id] && !gated;
    return Row({ muted: gated },
      RowText(m.label, gated ? (declined ? 'Not approved by your health system' : 'Under review by your health system') : m.sub, gated) +
      (gated ? Chip(declined ? 'Declined' : 'In review', declined ? 'danger' : 'warn') : '') +
      Toggle({ checked: on, disabled: gated, label: m.label, a: 'toggleMetric', p: m.id }));
  }));

function anyMetricOn() {
  var p = P();
  return METRICS.some(function (m) { return p.metrics[m.id] && (!m.gated || skinOK()); });

function DateModal() {
  if (!S.ui.dateModal) return '';

  return Modal({ title: 'Date range', close: 'closeDate', md: true },

/* ------------------------------ File upload ------------------------------ */

function DropZone(tall) {
  return '<div class="' + cls('dropzone', tall && 'tall', S.ui.dragging && 'drag') + '" data-drop="1">' +
    '<div class="up">' + ICON.upload + '</div>' +
    '<b>Drop a file here or click to browse</b>' +
    '<p>CSV, XML or JSON · up to 25 MB</p>' +
    '<input type="file" multiple hidden data-fileinput="1" /></div>';
}

function UploadList() {
  var ups = P().uploads;
  if (!ups.length) return '';
  return Card(map(ups, function (u) {
    var bad = u.status === 'error' || u.status === 'rejected';
    var detail = u.status === 'checking' ? 'Checking format… ' + u.progress + '%'
      : u.status === 'ready' ? 'Ready · ' + u.detail
      : u.status === 'error' ? 'Needs fixing: missing timestamps'
      : u.detail;
    return Row({ bad: bad },
      '<div class="uprow"><b>' + esc(u.name) + '</b><p>' + esc(detail) + '</p>' +
      (u.status === 'checking' ? '<div class="progress"><i style="width:' + u.progress + '%"></i></div>' : '') + '</div>' +
      (u.status === 'ready' ? Chip('Ready', 'success') : '') +
      (bad ? Btn({ label: 'Replace', size: 'sm', variant: 'secondary', a: 'removeUpload', p: u.id }) : ''));
  }));
}

var uploadsReady = function () {
  var u = P().uploads;
  return u.length > 0 && u.every(function (x) { return x.status === 'ready'; });
};
var readyCount = function () {
  return P().uploads.filter(function (u) { return u.status === 'ready'; }).length;
};

function MetricTile(m) {
  var c = CP().consent;
  var gated = m.gated && !skinOK();
  var revokedAt = CP().revoked[m.id];
  var live = c && c.metrics[m.id] && !gated;

  if (!live) {
    return '<div class="metrictile"><div class="top"><span>' + m.clinical + '</span></div>' +
      '<p class="off">' + (gated ? 'Not available' : 'Not shared') + '</p>' +
      '<p class="sub">' + (gated ? 'Metric not approved for clinical use'
        : revokedAt ? 'Patient stopped sharing on ' + new Date(revokedAt).toLocaleDateString()
        : 'Patient did not include this metric') + '</p></div>';
  }

  var value = m.id === 'hr' ? RECENT_HR : m.id === 'sleep' ? RECENT_SLEEP : m.id === 'steps' ? STEPS_AFTER : latest(m.key);
  var sub = m.id === 'hr' ? '30-day avg ' + HR_30D_AVG + ' · normal range'
    : m.id === 'steps' ? '7-day avg · down ' + STEPS_DROP_PCT + '% since ' + fmtShort(CHANGE_DATE)
    : m.id === 'sleep' ? 'Nightly avg · steady'
    : 'Nightly avg · within normal range';

  return '<div class="metrictile live"' + A({ a: 'openTrend', p: m.id }) + '>' +
    '<div class="top"><span>' + m.clinical + '</span>' +
    (m.id === 'steps' ? Chip('−' + STEPS_DROP_PCT + '%', 'warn') : '') + '</div>' +
    '<p class="big">' + m.format(value) + (m.suffix ? '<em>' + m.suffix + '</em>' : '') + '</p>' +
    '<p class="sub">' + sub + '</p></div>';
}

function findUpload(owner, id) {
  return owner.uploads.filter(function (u) { return u.id === id; })[0];
}

var ACCEPTED = ['csv', 'xml', 'json'];

// Stand-in for the server-side format check and unit conversion.
function addFiles(list) {
  Array.prototype.slice.call(list, 0, 4).forEach(function (file) {
    var owner = P();
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var ok = ACCEPTED.indexOf(ext) >= 0;
    var id = Math.random().toString(36).slice(2);

    owner.uploads.push({
      id: id, name: file.name, status: ok ? 'checking' : 'rejected', progress: 0,
      detail: ok ? '' : ext.toUpperCase() + ' files are not accepted. Use CSV, XML or JSON.'
    });
    if (!ok) return;

    var pct = 0;
    var tick = setInterval(function () {
      var u = findUpload(owner, id);
      if (!u) { clearInterval(tick); return; }
      pct += 18 + Math.random() * 22;
      if (pct >= 100) {
        clearInterval(tick);
        var bad = /sleep/i.test(file.name);
        u.status = bad ? 'error' : 'ready';
        u.progress = 100;
        u.detail = bad ? '' : '31 days found';
      } else {
        u.progress = Math.min(99, Math.round(pct));
      }
      render();
    }, 420);
  });
  render();
}

  var drop = e.target.closest('[data-drop]');
  if (drop) { drop.querySelector('[data-fileinput]').click(); return; }

  var el = e.target.closest('[data-a]');
  if (!el) return;
  // A backdrop only closes when the backdrop itself is clicked, not the dialog.
  if (el.classList.contains('backdrop') && e.target.closest('[data-stop]')) return;

  var fn = ACT[el.dataset.a];
  if (!fn) return;
  fn(el.dataset.p, el.dataset.q);
  render();
});

root.addEventListener('input', function (e) {
  var el = e.target.closest('[data-in]');
  if (!el) return;
  var fn = ACT[el.dataset.in];
  if (!fn) return;
  fn(el.value, el.dataset.p);
  render();
});

root.addEventListener('change', function (e) {
  var input = e.target.closest('[data-fileinput]');
  if (input && input.files && input.files.length) { addFiles(input.files); input.value = ''; }
});

['dragover', 'dragenter'].forEach(function (evt) {
  root.addEventListener(evt, function (e) {
    if (!e.target.closest('[data-drop]')) return;
    e.preventDefault();
    if (!S.ui.dragging) { S.ui.dragging = true; render(); }
  });
});
root.addEventListener('dragleave', function (e) {
  if (!e.target.closest('[data-drop]')) return;
  if (S.ui.dragging) { S.ui.dragging = false; render(); }
});
root.addEventListener('drop', function (e) {
  var drop = e.target.closest('[data-drop]');
  if (!drop) return;
  e.preventDefault();
  S.ui.dragging = false;
  if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  else render();
});

window.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (S.ui.menu) { S.ui.menu = null; render(); return; }
  if (S.ui.dateModal) { S.ui.dateModal = false; render(); return; }
  if (S.ui.decisionModal) { ACT.closeDecision(); render(); return; }
  if (S.clinician.consentModal) { S.clinician.consentModal = false; render(); }
});

/* ------------------------------ Chart hover ------------------------------ */

function clearHovers() {
  Array.prototype.forEach.call(root.querySelectorAll('[data-chart]'), function (w) {
    var g = w.querySelector('.hoverg'), tip = w.querySelector('.tip');
    if (g) g.innerHTML = '';
    if (tip) tip.style.display = 'none';
  });
}

root.addEventListener('mousemove', function (e) {
  var wrap = e.target.closest ? e.target.closest('[data-chart]') : null;
  if (!wrap) { clearHovers(); return; }
  var c = charts[wrap.getAttribute('data-chart')];
  if (!c) return;

  var svg = wrap.querySelector('svg');
  var rect = svg.getBoundingClientRect();
  var px = ((e.clientX - rect.left) / rect.width) * c.width;

  var best = null;
  c.points.forEach(function (p) {
    if (p.v === null) return;
    var d = Math.abs(p.x - px);
    if (!best || d < best.d) best = { d: d, p: p };
  });

  var g = wrap.querySelector('.hoverg'), tip = wrap.querySelector('.tip');
  if (best && best.d < 24) {
    var p = best.p;
    g.innerHTML = '<line x1="' + p.x + '" x2="' + p.x + '" y1="' + c.top + '" y2="' + c.bottom +
      '" stroke="rgb(156 163 175)" stroke-width="1"/>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="5" fill="rgb(15 118 110)" stroke="white" stroke-width="2.5"/>';
    tip.style.display = 'flex';
    tip.style.left = ((p.x / c.width) * 100) + '%';
    tip.querySelector('b').textContent = c.format ? c.format(p.v) : p.v;
    tip.querySelector('span').textContent = fmtShort(p.date);
  } else {
    g.innerHTML = '';
    tip.style.display = 'none';
  }
});

root.addEventListener('mouseleave', clearHovers, true);

/* -------------------------------- Boot ---------------------------------- */
render();

})();
</script>
</body>
</html>
